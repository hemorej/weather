allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true

# Supply-chain safety net: refuse to resolve/install package versions
# published more recently than this window. Malicious or compromised
# releases are typically caught and pulled from the registry within
# hours to a couple of days, so this buys that detection window before
# a bad version can land in our lockfile. 4320 minutes = 3 days.
minimumReleaseAge: 4320
# Exceptions for packages where we need to react fast (e.g. security
# patches you've manually verified): add the package name here.
# minimumReleaseAgeExclude:
#   - some-package

# Security overrides for transitive deps flagged by Dependabot.
# Remove once nuxt pulls in patched versions.
overrides:
  undici: '^8.10.2'
  svgo: '^4.1.0'
  source-map-js: '^1.2.2'
  shell-quote: '^1.11.0'
  '@nuxt/devtools': '-'
  '@vitejs/devtools': '-'
  '@vitejs/devtools-kit': '-'

# Build/dev-time only transitive deps of nuxt > nitropack (listhen dev server,
# globby file matching); neither ships in .output. Remove once patched upstream.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge
    - GHSA-vfj7-8cjw-p6xm # braces
