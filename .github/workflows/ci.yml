name: CI

# Frozen-lockfile install so CI can never silently re-resolve dependency
# versions outside what's checked into pnpm-lock.yaml (and outside the
# minimumReleaseAge window enforced in pnpm-workspace.yaml). Also runs
# pnpm audit (known vulnerabilities) and audit signatures (npm registry
# provenance) on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Verify npm registry signatures
        run: pnpm audit signatures
