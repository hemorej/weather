name: CI

# Frozen-lockfile install so CI can never silently re-resolve dependency
# versions outside what's checked into pnpm-lock.yaml (and outside the
# minimumReleaseAge window enforced in pnpm-workspace.yaml). Also runs
# pnpm audit (known vulnerabilities) and audit signatures (npm registry
# provenance) on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Verify npm registry signatures
        run: pnpm audit signatures

  # Deploys only after `build` passes, and only for pushes to main (never PRs).
  # Quick Deploy is off in Forge; this calls the site's Deployment Trigger URL,
  # which just makes Forge deploy its configured branch. The URL lives in the
  # `production` Environment (restricted to main), not in repo-level secrets.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Forge deployment
        # forge_deploy_* are Forge's reserved params: they fill the Deployments
        # table (otherwise N/A) and the FORGE_DEPLOY_* env vars in the deploy
        # script. Values go through env, never interpolated into the shell.
        env:
          FORGE_DEPLOY_URL: ${{ secrets.FORGE_DEPLOY_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -fsS --max-time 30 -G "$FORGE_DEPLOY_URL" \
            --data-urlencode "forge_deploy_branch=main" \
            --data-urlencode "forge_deploy_commit=$COMMIT_SHA" \
            --data-urlencode "forge_deploy_author=$COMMIT_AUTHOR" \
            --data-urlencode "forge_deploy_message=${COMMIT_MESSAGE%%$'\n'*}" \
            > /dev/null
